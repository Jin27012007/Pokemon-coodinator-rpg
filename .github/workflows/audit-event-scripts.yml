name: Audit event script references

on:
  workflow_dispatch:
  push:
    branches:
      - experimental/pokeemerald-reference
    paths:
      - "tools/audit_event_script_refs.py"
      - "docs/AUDITORIA_GLOBAL_EVENTOS.md"
      - ".github/workflows/audit-event-scripts.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout audit tooling
        uses: actions/checkout@v4

      - name: Install GBA build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib python3 perl libpng-dev

      - name: Fetch pinned pokeemerald-expansion source
        run: |
          git clone --no-checkout https://github.com/rh-hideout/pokeemerald-expansion.git source
          git -C source fetch --depth 1 origin f4dc700a130330fd2f9325a17bbb1e2d91dbf091
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "f4dc700a130330fd2f9325a17bbb1e2d91dbf091"

      - name: Copy audit tool into source tree
        run: cp tools/audit_event_script_refs.py source/tools/audit_event_script_refs.py

      - name: Run heuristic audit
        working-directory: source
        run: python3 tools/audit_event_script_refs.py | tee event-script-audit.txt

      - name: Apply narrow GCC compatibility shim
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("src/battle_gfx_sfx_util.c")
          s = p.read_text()
          s, n1 = re.subn(
              r"(case 6 \.\.\. 9:\n)([ ]+)(enum BattlerPosition position = GetBattlerPosition\(\(enum BattlerId\)\(state - 6\)\);)",
              r"\1\2;\n\2\3", s, count=1
          )
          s, n2 = re.subn(
              r"(case 4:\n[ ]+case 5:\n)([ ]+)(enum BattlerPosition position = GetBattlerPosition\(\(enum BattlerId\)\(state - 4\)\);)",
              r"\1\2;\n\2\3", s, count=1
          )
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"Expected compatibility edits once each, got {n1} and {n2}")
          p.write_text(s)
          PY

      - name: Compile full pinned ROM (validates assembled scripts and symbols)
        working-directory: source
        run: make -j2 CFLAGS="-std=gnu17"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-script-audit-report
          path: source/event-script-audit.txt
          if-no-files-found: warn
          retention-days: 14
