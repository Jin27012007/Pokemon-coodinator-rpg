name: Build experimental prototype

on:
  workflow_dispatch:
  push:
    branches:
      - experimental/pokeemerald-reference
    paths:
      - "patches/**"
      - ".github/workflows/build-prototype.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib python3 python3-pip libpng-dev

      - name: Download reference source
        run: |
          git clone --depth 1 https://github.com/rh-hideout/pokeemerald-expansion.git source
          git -C source rev-parse HEAD | tee source-revision.txt

      - name: Apply prototype patch
        run: |
          git -C source apply --check "$GITHUB_WORKSPACE/patches/0003-lilycove-female-prototype.patch"
          git -C source apply "$GITHUB_WORKSPACE/patches/0003-lilycove-female-prototype.patch"

      - name: Build ROM
        working-directory: source
        run: |
          make -j2

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lilycove-prototype-build
          path: |
            source/*.gba
            source/*.elf
            source-revision.txt
          if-no-files-found: warn
          retention-days: 7
