name: Build female-default boat-arrival prototype

on:
  workflow_dispatch:
  push:
    branches:
      - experimental/pokeemerald-reference
    paths:
      - "patches/0004-female-default-and-boat-arrival.patch"
      - ".github/workflows/build-boat-arrival.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib python3 python3-pip libpng-dev

      - name: Download reference source
        run: |
          git clone https://github.com/rh-hideout/pokeemerald-expansion.git source
          git -C source checkout f4dc700a130330fd2f9325a17bbb1e2d91dbf091
          git -C source rev-parse HEAD | tee source-revision.txt

      - name: Apply Lilycove start patch
        run: |
          git -C source apply --check "$GITHUB_WORKSPACE/patches/0003-lilycove-female-prototype.patch"
          git -C source apply "$GITHUB_WORKSPACE/patches/0003-lilycove-female-prototype.patch"
          git -C source apply --check "$GITHUB_WORKSPACE/patches/0004-female-default-and-boat-arrival.patch"
          git -C source apply "$GITHUB_WORKSPACE/patches/0004-female-default-and-boat-arrival.patch"

      - name: Apply compatibility fix for GCC labels
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/battle_gfx_sfx_util.c")
          s = p.read_text()
          s = s.replace(
              "        case 6 ... 9:\n            enum BattlerPosition position = GetBattlerPosition((enum BattlerId)(state - 6));",
              "        case 6 ... 9:\n            ;\n            enum BattlerPosition position = GetBattlerPosition((enum BattlerId)(state - 6));"
          )
          s = s.replace(
              "        case 5:\n            enum BattlerPosition position = GetBattlerPosition((enum BattlerId)(state - 4));",
              "        case 5:\n            ;\n            enum BattlerPosition position = GetBattlerPosition((enum BattlerId)(state - 4));"
          )
          p.write_text(s)
          PY

      - name: Build ROM
        working-directory: source
        run: make -j2 CFLAGS="-std=gnu17"

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: female-default-boat-arrival-build
          path: |
            source/*.gba
            source/*.elf
            source-revision.txt
          if-no-files-found: warn
          retention-days: 7
